[package]
name = "autoclip-compositor-wasm"
version = "0.1.0"
description = "WASM bindings for AutoClip compositor export"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
autoclip-compositor = { path = "../compositor" }
autoclip-document = { path = "../document" }
base64 = "0.22"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
